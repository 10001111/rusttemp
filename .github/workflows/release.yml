# Builds the release downloads when a version tag is pushed:
#
#     git tag v0.1.0
#     git push origin v0.1.0
#
# The asset names have no version number in them, so the installers can
# always download .../releases/latest/download/<asset>.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test
        run: cargo test --release --locked
      # The C runtime is linked statically (.cargo/config.toml), so the
      # programs need no Visual C++ Redistributable.
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = 'rusttemp-x86_64-pc-windows-msvc'
          $dir = "dist/$name"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item target/release/cpu.exe, target/release/gpu.exe, target/release/rusttemp.exe, uninstall.ps1, README.md, LICENSE.md -Destination $dir
          python scripts/third_party_licenses.py --target x86_64-pc-windows-msvc --out "$dir/THIRD_PARTY_LICENSES.md"
          & "$dir/rusttemp.exe" --version
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/dist/$name.zip.sha256", "$hash  $name.zip`n")
          Get-Content "dist/$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.sha256

  linux:
    name: Build Linux x86_64 (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
          sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test
        run: cargo test --release --locked
      # Static musl build: runs on any x86_64 Linux. NVIDIA (NVML) support is
      # left out because a static program cannot load NVIDIA's library.
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl --no-default-features
      - name: Package
        run: |
          name=rusttemp-x86_64-unknown-linux-musl
          dir="dist/$name"
          mkdir -p "$dir"
          for p in cpu gpu rusttemp; do cp "target/x86_64-unknown-linux-musl/release/$p" "$dir/"; done
          cp README.md LICENSE.md "$dir/"
          python3 scripts/third_party_licenses.py --target x86_64-unknown-linux-musl --no-default-features --out "$dir/THIRD_PARTY_LICENSES.md"
          "$dir/rusttemp" --version
          tar -czf "dist/$name.tar.gz" -C "$dir" .
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" && cat "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    name: Publish GitHub release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "RustTemp $GITHUB_REF_NAME" \
            --generate-notes
