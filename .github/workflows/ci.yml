name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy (without NVIDIA support)
        run: cargo clippy --all-targets --locked --no-default-features -- -D warnings
      - name: Test
        run: cargo test --locked

  linux-static:
    name: Static Linux build (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
          sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl --no-default-features

  msrv:
    name: Minimum Rust version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85 --profile minimal
      - name: Check
        run: cargo +1.85 check --locked
